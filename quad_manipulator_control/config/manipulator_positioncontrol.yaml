quad_manipulator:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  arm_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
    gains:
      arm_joint_1: {p: 1, i: 0.05, d: 0.001}
      arm_joint_2: {p: 1, i: 0.05, d: 0.001}
      arm_joint_3: {p: 1, i: 0.05, d: 0.001}
  grasp_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - grasp_joint_1
      - grasp_joint_2
    gains:
      grasp_joint_1: {p: 0.5, i: 0.05, d: 0.001}
      grasp_joint_2: {p: 0.5, i: 0.05, d: 0.001}